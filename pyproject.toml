[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-geometry"
version = "0.1.0"
description = "Measure facial landmark geometry change between two folders of photographs (no identity recognition)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "mediapipe>=0.10.14",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
face-geometry = "face_geometry.cli:main"

[tool.setuptools.packages.find]
include = ["face_geometry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
